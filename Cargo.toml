[package]
name = "perfm"
version = "0.1.0"
edition = "2024"
description = "A lightweight Windows hardware performance monitor"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
nvml-wrapper = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
wmi = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
